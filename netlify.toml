[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# Redirección de todas las llamadas API a la función Serverless de Netlify
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Redirección SPA para que cualquier ruta de React cargue index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
